name: Build dashboard

# Extract compact dashboard JSON from git objects (no full worktree of .pt),
# rebuild site templates, optionally publish branch `pages`.
# Torch is NOT required unless fetch_weights=true.

on:
  workflow_dispatch:
    inputs:
      study_filter:
        description: "Optional substring filter for studies (empty = all discoverable)"
        required: false
        default: ""
      publish_pages:
        description: "Push built site/ to branch pages"
        type: boolean
        default: true
      fetch_weights:
        description: "Allow reading champion .pt when weight_stats JSON missing (installs torch CPU)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "tools/runs_dashboard/**"
      - ".github/workflows/build-dashboard.yml"

concurrency:
  group: build-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-build:
    name: Extract + build site
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Clone partial (blob:none) + sparse tools/site
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git clone --filter=blob:none --sparse --depth 1 \
            --branch "${BRANCH}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git sparse-checkout set tools site
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git rev-parse --short HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install torch (only if fetch_weights)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_weights }}
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile dashboard tools
        working-directory: repo
        run: |
          set -e
          for f in \
            tools/runs_dashboard/metrics.py \
            tools/runs_dashboard/topology_metrics.py \
            tools/runs_dashboard/weight_pt_stats.py \
            tools/runs_dashboard/extract.py \
            tools/runs_dashboard/build_site.py \
            tools/runs_dashboard/validate_site.py
          do
            python -m py_compile "$f"
          done

      - name: Smoke import extract (no torch required)
        working-directory: repo
        run: |
          set -e
          cd tools/runs_dashboard
          python -c "import extract, build_site, validate_site, weight_pt_stats; print('imports ok')"

      - name: Extract dashboard data from git objects
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p site/data
          EXTRA=()
          FILTER="${{ github.event_name == 'workflow_dispatch' && inputs.study_filter || '' }}"
          if [ -n "$FILTER" ]; then
            EXTRA+=(--study-filter "$FILTER")
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.fetch_weights || false }}" = "true" ]; then
            EXTRA+=(--fetch-weights)
          fi
          python tools/runs_dashboard/extract.py \
            --git-dir .git \
            --ref HEAD \
            --out site \
            --full \
            "${EXTRA[@]}"
          test -f site/data/studies.json

      - name: Build + validate site
        working-directory: repo
        run: |
          set -e
          python tools/runs_dashboard/build_site.py --out site
          python tools/runs_dashboard/validate_site.py --site site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: runs-dashboard-site
          path: repo/site/
          retention-days: 14

      - name: Publish pages branch
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pages)
              || github.event_name == 'push' }}
        working-directory: repo
        run: |
          set -euo pipefail
          python tools/runs_dashboard/build_site.py --out site
          WORK=/tmp/pages_publish
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp -a site/. "$WORK/"
          cd "$WORK"
          git init -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "pages: dashboard site from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin pages:pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
