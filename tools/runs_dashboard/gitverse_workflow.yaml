name: Dashboard tools check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile tools and build site shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tools + workflow only; do not need full run history for this job.
          fetch-depth: 1
          sparse-checkout: |
            tools/runs_dashboard
            site
            .gitverse
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Compile dashboard Python
        run: |
          set -e
          for f in \
            tools/runs_dashboard/metrics.py \
            tools/runs_dashboard/topology_metrics.py \
            tools/runs_dashboard/weight_pt_stats.py \
            tools/runs_dashboard/extract.py \
            tools/runs_dashboard/backfill_weight_stats.py \
            tools/runs_dashboard/build_site.py
          do
            echo "py_compile $f"
            python -m py_compile "$f"
          done

      - name: Build site templates
        run: |
          set -e
          python tools/runs_dashboard/build_site.py --out site
          test -f site/index.html
          test -f site/study.html
          test -f site/run.html
          test -f site/assets/app.js
          test -f site/assets/charts.js
          test -f site/assets/style.css
          mkdir -p site/data
          if [ ! -f site/data/studies.json ]; then
            printf '%s\n' '{"generated_at":"ci","head":"ci","studies":[]}' > site/data/studies.json
          fi
          python -c "import json; d=json.load(open('site/data/studies.json',encoding='utf-8')); assert 'studies' in d; print('studies', len(d['studies']))"

      - name: Upload site artifact
        uses: actions/upload-artifact@v3
        with:
          name: runs-dashboard-site
          path: site/
          retention-days: 7
